[project]
name = "caps"
version = "0.2.0"
description = "Communication-Adaptive Policy System — Learning Adaptive Communication Policies for Efficient Multi-Agent LLM Collaboration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "groq>=0.9.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "sentence-transformers>=2.2",
    "sqlalchemy>=2.0",
    "typer[all]>=0.9",
    "rich>=13.0",
    "tqdm>=4.65",
    "tenacity>=8.2",
    "jinja2>=3.1",
    "structlog>=23.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
caps = "caps.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
