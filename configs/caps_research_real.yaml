name: caps_research_real
seed: 1

# Dataset
dataset:
  name: synthetic_v2
  size: 50          # 30 train / 10 val / 10 test
  seed: 42

# Methods to evaluate (5 core methods for feasible campaign)
methods:
  - FullContext-Unbounded
  - FullContext-Budgeted
  - Heuristic
  - CAPS-NoVOI
  - CAPS-VOI

# Budget fractions
budget_fractions: [1.0, 0.5, 0.3]

# Seeds
seeds: [1, 2, 3]

# LLM
models:
  planner: qwen/qwen3.8-27b
  receiver: qwen/qwen3.8-27b
  evaluator: qwen/qwen3.8-27b

# LinUCB hyperparameters
policy:
  alpha: 1.0
  selection_strategy: greedy_budget

# Output paths
results_dir: research/results
checkpoint_dir: research/checkpoints
manifest_dir: research/manifests
data_dir: data/research

embedding_model: all-MiniLM-L6-v2
verbose: false
